  <script src="/_sdk/1473331b860cdf5c.editing_sdk.js" integrity="sha512-zd/WiNJmdX2rRMgSDon0ny7eSp9O1vzGBXvBfGBu3AbU02LcUa3u+AcBTlNj+As6xOR2OKa6lFg023tgHMv5KQ=="></script>
  <script src="/_sdk/6c2ecc939521f244.data_sdk.js" integrity="sha512-gRx8s+XsZDN6mSIQu2sivLZysbV0WHhb5kXNUWlgVb5lCMU1foJYukyMEDPv8Tnoocb8iwqB4XdRrWc7oEGzIQ=="></script>
  <script>
        const PAIRS = [
            { formula: 'CH₃–', name: 'methyl' },
            { formula: 'C₂H₅–', name: 'ethyl' },
            { formula: 'CH₃–CH₂–CH₂–', name: 'propyl' },
            { formula: '(CH₃)₂CH–', name: 'isopropyl' },
            { formula: '(CH₃)₂CH–CH₂–CH₂–', name: 'isoamyl' },
            { formula: 'CH₂=CH–', name: 'vinyl' },
            { formula: 'CH₂=CH–CH₂–', name: 'allyl' },
            { formula: 'C₆H₅–', name: 'phenyl' },
            { formula: 'C₆H₅–CH₂–', name: 'benzyl' }
        ];

        let leaderboardData = [];
        let selectedA = null;
        let matchedPairs = 0;
        let score = 0;
        let timerInterval = null;
        let startTime = null;
        let gameActive = false;

        const dataHandler = {
            onDataChanged(data) {
                leaderboardData = data.slice().sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    return a.time_seconds - b.time_seconds;
                });
                renderLeaderboard();
            }
        };

        window.dataSdk.init(dataHandler);

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function startGame() {
            const name = document.getElementById('team-input').value.trim();
            if (!name) { document.getElementById('team-input').focus(); return; }
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            score = 0; matchedPairs = 0; selectedA = null; gameActive = true;
            document.getElementById('score-display').textContent = '0/10';
            document.getElementById('lines-svg').innerHTML = '';
            buildColumns();
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
        }

        function buildColumns() {
            const colA = document.getElementById('col-a');
            const colB = document.getElementById('col-b');
            colA.innerHTML = ''; colB.innerHTML = '';
            const shuffledA = shuffle(PAIRS);
            const shuffledB = shuffle(PAIRS);
            shuffledA.forEach((p, i) => {
                const el = document.createElement('button');
                el.className = 'match-item bg-blue-50 border-2 border-blue-200 rounded-lg px-4 py-3 text-left font-mono text-sm';
                el.textContent = p.formula;
                el.dataset.name = p.name;
                el.dataset.side = 'a';
                el.dataset.index = i;
                el.onclick = () => selectItem(el, 'a');
                colA.appendChild(el);
            });
            shuffledB.forEach((p, i) => {
                const el = document.createElement('button');
                el.className = 'match-item bg-amber-50 border-2 border-amber-200 rounded-lg px-4 py-3 text-left font-medium';
                el.textContent = p.name;
                el.dataset.name = p.name;
                el.dataset.side = 'b';
                el.dataset.index = i;
                el.onclick = () => selectItem(el, 'b');
                colB.appendChild(el);
            });
        }

        function selectItem(el, side) {
            if (!gameActive || el.classList.contains('matched')) return;
            if (side === 'a') {
                if (selectedA) selectedA.classList.remove('selected');
                selectedA = el;
                el.classList.add('selected');
            } else if (side === 'b' && selectedA) {
                checkMatch(selectedA, el);
            }
        }

        function checkMatch(a, b) {
            if (a.dataset.name === b.dataset.name) {
                score += 2; matchedPairs++;
                a.classList.remove('selected');
                a.classList.add('matched');
                b.classList.add('matched');
                drawLine(a, b);
                document.getElementById('score-display').textContent = score + '/10';
                if (matchedPairs === 9) endGame();
            } else {
                a.classList.remove('selected');
                b.classList.add('wrong');
                setTimeout(() => b.classList.remove('wrong'), 400);
            }
            selectedA = null;
        }

        function drawLine(a, b) {
            const svg = document.getElementById('lines-svg');
            const container = document.getElementById('columns-container');
            const rect = container.getBoundingClientRect();
            const aRect = a.getBoundingClientRect();
            const bRect = b.getBoundingClientRect();
            const x1 = aRect.right - rect.left;
            const y1 = aRect.top + aRect.height / 2 - rect.top;
            const x2 = bRect.left - rect.left;
            const y2 = bRect.top + bRect.height / 2 - rect.top;
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1); line.setAttribute('y1', y1);
            line.setAttribute('x2', x2); line.setAttribute('y2', y2);
            line.classList.add('line-correct', 'line-animation');
            svg.appendChild(line);
        }

        function updateTimer() {
            const s = Math.floor((Date.now() - startTime) / 1000);
            const m = String(Math.floor(s / 60)).padStart(2, '0');
            const sec = String(s % 60).padStart(2, '0');
            document.getElementById('time-display').textContent = m + ':' + sec;
        }

        async function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('result-score').textContent = score + ' điểm';
            const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const sec = String(elapsed % 60).padStart(2, '0');
            document.getElementById('result-time').textContent = 'Thời gian: ' + m + ':' + sec;

            const teamName = document.getElementById('team-input').value.trim();
            if (leaderboardData.length >= 999) return;
            await window.dataSdk.create({
                team_name: teamName,
                score: score,
                time_seconds: elapsed,
                completed_at: new Date().toISOString()
            });
        }

        function resetToStart() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('team-input').value = '';
        }

        function renderLeaderboard() {
            const tbody = document.getElementById('lb-body');
            const table = document.getElementById('lb-table');
            const empty = document.getElementById('lb-empty');
            if (leaderboardData.length === 0) {
                table.classList.add('hidden'); empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden'); table.classList.remove('hidden');
            tbody.innerHTML = '';
            leaderboardData.forEach((r, i) => {
                const tr = document.createElement('tr');
                tr.className = 'border-b';
                const s = r.time_seconds || 0;
                const m = String(Math.floor(s / 60)).padStart(2, '0');
                const sec = String(s % 60).padStart(2, '0');
                tr.innerHTML = `<td class="py-2 px-2 font-bold">${i + 1}</td><td class="py-2 px-2">${r.team_name || ''}</td><td class="py-2 px-2 text-center font-bold">${r.score}</td><td class="py-2 px-2 text-center font-mono">${m}:${sec}</td>`;
                tbody.appendChild(tr);
            });
        }

        function showClearModal() { document.getElementById('clear-modal').classList.remove('hidden'); document.getElementById('pw-error').classList.add('hidden'); document.getElementById('password-input').value = ''; }
        function hideClearModal() { document.getElementById('clear-modal').classList.add('hidden'); }

        async function confirmClear() {
            const pw = document.getElementById('password-input').value;
            if (pw !== 'Giaovien123') {
                document.getElementById('pw-error').classList.remove('hidden');
                return;
            }
            for (const r of leaderboardData) {
                await window.dataSdk.delete(r);
            }
            hideClearModal();
        }

        lucide.createIcons();
    </script>
